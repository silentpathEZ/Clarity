<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hand Tracking 3D</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }

      #instructions {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 15px 25px;
        border-radius: 10px;
        text-align: center;
        max-width: 600px;
      }

      #instructions h3 {
        margin: 0 0 10px 0;
        color: #4caf50;
      }

      #instructions ol {
        text-align: left;
        margin: 10px 0;
        padding-left: 20px;
      }

      #instructions li {
        margin: 5px 0;
      }

      #gesture-display {
        animation: glow 2s ease-in-out infinite alternate;
      }

      @keyframes glow {
        from { box-shadow: 0 0 10px rgba(0, 255, 136, 0.3); }
        to { box-shadow: 0 0 25px rgba(0, 255, 136, 0.6); }
      }
    </style>
  </head>
  <body>
    <div id="instructions">
      <h3>🚀 Setup Instructions</h3>
      <ol>
        <li>Run: <code>node bridge.js</code> in terminal</li>
        <li>Run: <code>python hand_tracking.py</code></li>
        <li>Show your hand to the camera</li>
        <li>Watch the 3D model move!</li>
      </ol>
      <p style="font-size: 12px; margin-top: 10px">
        Press 'q' in the camera window to quit
      </p>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
